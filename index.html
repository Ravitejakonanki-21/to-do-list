<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>120-Day Python Full-Stack + AI Tracker</title>
<style>

html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 150px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hdr);z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hdr);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:10px 14px}
.wrap{max-width:760px;margin:0 auto}
h1{font-size:17px;margin:0 0 8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;text-align:center}
.stat b{display:block;font-size:18px}.stat span{font-size:11px;color:var(--muted)}
.bar{height:8px;background:var(--line);border-radius:6px;margin:8px 0;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .3s}
.chips{display:flex;gap:6px;overflow-x:auto;padding:2px 0}
.chip{flex:none;border:1px solid var(--line);background:var(--card);color:var(--text);border-radius:999px;padding:5px 11px;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);border-color:var(--accent);color:#fff}
main{padding:12px 14px 40px}
.set{display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:13px;color:var(--muted);margin-bottom:12px}
.set input,.set button{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--text)}
.next{background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:12px;margin-bottom:12px}
.next small{color:var(--accent);font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.day{display:flex;gap:10px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.day.rev{background:var(--rev)}.day.done{background:var(--okbg)}.day.today{outline:2px solid var(--accent)}
.day input[type=checkbox]{width:22px;height:22px;margin-top:2px;accent-color:var(--ok);flex:none}
.body{flex:1;min-width:0}
.top{display:flex;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}
.t{font-weight:600;margin:2px 0}.o{font-size:13.5px}.o em{font-style:normal;color:var(--muted)}
.h{display:flex;align-items:center;gap:6px;margin-top:6px;font-size:12px;color:var(--muted)}
.h input{width:62px;font:inherit;padding:3px 6px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text)}
.ph{font-weight:700;margin:16px 0 8px;font-size:14px}
</style></head><body>
<header><div class="wrap">

<div class="stats"><div class="stat"><b id="s1">0</b><span>days done</span></div><div class="stat"><b id="s2">0%</b><span>progress</span></div><div class="stat"><b id="s3">0</b><span>hours</span></div><div class="stat"><b id="s4">Day 1</b><span id="s5">today</span></div></div>
<div class="bar"><i id="bar"></i></div>
<div class="chips" id="chips"></div>
</div></header>
<main><div class="wrap">
<div class="set"><label>Start date <input type="date" id="start"></label><button id="today">Jump to today</button><button id="reset">Reset progress</button></div>
<div class="next" id="next"></div>
<div id="list"></div>
<p style="font-size:12px;color:var(--muted)">Progress is saved in this browser only. Every 7th day is a review and buffer day. Write the code yourself, commit to GitHub, and be able to explain what you built.</p>
</div></main>

, "10 applications sent", "Mixed timed practice: revisit weak topics", 0], [118, 5, "Mock interview and weak-area fixes", "Mock interview feedback", "Mixed timed practice: revisit weak topics", 0], [119, 5, "Weekly review + buffer", "Review the week, catch up, rebuild one feature, answer 5 questions aloud", "Revise the week’s DSA", 1], [120, 5, "Final mock interview, apply, readiness assessment", "Final readiness assessment", "Mixed timed practice: revisit weak topics", 0]];
const PH=["Python, OOP & Git","SQL, Django & REST APIs","Frontend & React","ML & AI APIs","AI Career Assistant","Production & job prep"];
const KEY="plan120.v1";
let S={start:null,done:{},hours:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const iso=d=>{const z=new Date(d.getTime()-d.getTimezoneOffset()*6e4);return z.toISOString().slice(0,10)};
if(!S.start)S.start=iso(new Date());
const $=id=>document.getElementById(id);
let filter="all";
const dayDate=n=>{const [y,m,d]=S.start.split("-").map(Number);return new Date(y,m-1,d+n-1)};
const fmt=d=>d.toLocaleDateString(undefined,{weekday:"short",day:"numeric",month:"short"});
const todayNum=()=>{const [y,m,d]=S.start.split("-").map(Number);const t=new Date();const a=new Date(t.getFullYear(),t.getMonth(),t.getDate());return Math.round((a-new Date(y,m-1,d))/864e5)+1};
function chips(){const c=$("chips");c.innerHTML="";[["all","All"],["todo","To do"]].concat(PH.map((p,i)=>[String(i),(i+1)+". "+p.split(",")[0].split(" &")[0]])).forEach(([k,l])=>{const b=document.createElement("button");b.className="chip";b.textContent=l;b.setAttribute("aria-pressed",filter===k);b.onclick=()=>{filter=k;chips();render()};c.appendChild(b)})}
function stats(){const n=Object.keys(S.done).filter(k=>S.done[k]).length;const h=Object.values(S.hours).reduce((a,b)=>a+(+b||0),0);
$("s1").textContent=n;$("s2").textContent=Math.round(n/1.2)+"%";$("s3").textContent=Math.round(h*10)/10;$("bar").style.width=(n/1.2)+"%";
const t=todayNum();$("s4").textContent=t<1?"Starts soon":t>120?"Finished":"Day "+t;
const exp=Math.max(0,Math.min(120,t-1));const diff=n-exp;$("s5").textContent=t<1?"not started":diff>=0?(diff?"+"+diff+" ahead":"on track"):(-diff)+" behind";
const nx=D.find(x=>!S.done[x[0]]);const el=$("next");
if(!nx){el.innerHTML="<small>All done</small><div class='t'>You finished the plan 🎉</div><div class='o'>Keep applying and keep building.</div>"}
else el.innerHTML="<small>Up next · Day "+nx[0]+" · "+fmt(dayDate(nx[0]))+"</small><div class='t'>"+nx[2]+"</div><div class='o'><em>Output:</em> "+nx[3]+"</div>"+(nx[4]?"<div class='o'><em>DSA:</em> "+nx[4]+"</div>":"")}
function render(){const L=$("list");L.innerHTML="";const t=todayNum();let last=-1;
D.forEach(x=>{const [n,p,f,o,dsa,rev]=x;
if(filter==="todo"&&S.done[n])return;if(/^\d$/.test(filter)&&+filter!==p)return;
if(p!==last){const h=document.createElement("div");h.className="ph";h.style.color="var(--p"+p+")";h.textContent="Phase "+(p+1)+" · "+PH[p];L.appendChild(h);last=p}
const e=document.createElement("div");e.id="d"+n;e.className="day"+(rev?" rev":"")+(S.done[n]?" done":"")+(n===t?" today":"");e.style.setProperty("--c","var(--p"+p+")");
e.innerHTML="<input type='checkbox' aria-label='Mark day "+n+" done' "+(S.done[n]?"checked":"")+"><div class='body'><div class='top'><span>Day "+n+" · "+fmt(dayDate(n))+"</span>"+(n===t?"<b style='color:var(--accent)'>Today</b>":"")+"</div><div class='t'>"+f+"</div><div class='o'><em>Output:</em> "+o+"</div>"+(dsa?"<div class='o'><em>DSA:</em> "+dsa+"</div>":"")+"<div class='h'>Hours <input type='number' min='0' max='16' step='0.25' inputmode='decimal' value='"+(S.hours[n]||"")+"'></div></div>";
e.querySelector("input[type=checkbox]").onchange=ev=>{S.done[n]=ev.target.checked;save();e.classList.toggle("done",ev.target.checked);stats();if(filter==="todo")render()};
e.querySelector("input[type=number]").oninput=ev=>{S.hours[n]=ev.target.value;save();stats()};
L.appendChild(e)})}
$("start").value=S.start;
$("start").onchange=e=>{if(e.target.value){S.start=e.target.value;save();stats();render()}};
$("today").onclick=()=>{const t=Math.min(120,Math.max(1,todayNum()));filter="all";chips();render();const el=$("d"+t);if(el)el.scrollIntoView({behavior:"smooth",block:"start"})};
$("reset").onclick=()=>{if(confirm("Clear all progress and hours?")){S.done={};S.hours={};save();stats();render()}};
chips();stats();render();
</script></body></html>
